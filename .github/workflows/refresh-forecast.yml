name: Refresh live forecast

on:
  schedule:
    - cron: '30 22 * * *'   # 06:30 Malaysia time
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: pipeline
      - run: python -m lega.live
        working-directory: pipeline
      - name: Commit and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "lega-bot"
          git config user.email "lega-bot@users.noreply.github.com"
          git add web/public/data/forecast_live.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "Refresh live 14-day forecast"
          git push
          gh workflow run deploy.yml
